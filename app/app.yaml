# Databricks Apps runtime configuration for the Customer 360 Streamlit app.
#
# Schema: https://docs.databricks.com/aws/en/dev-tools/databricks-apps/app-runtime
# app.yaml supports ONLY two keys: `command` and `env`. There is no
# `user_authorization` / `user_api_scopes` key in the runtime schema — OBO
# scopes are configured on the *app resource*, not here (see the note at the
# bottom of this file and resources/app.yml).
#
# This app source directory IS app/, so streamlit_app.py is referenced relative
# to this file (no path prefix).
#
# PORT: Databricks Apps assigns the listening port dynamically and substitutes
# the DATABRICKS_APP_PORT token into the command at runtime. Per the runtime
# docs: "DATABRICKS_APP_PORT ... is substituted with the actual port number in
# the command at runtime." Do NOT hardcode a port. --server.address 0.0.0.0 is
# required so the app binds all interfaces behind the Apps proxy.
#
# SECRETS: none live here. Lakebase auth uses short-lived Databricks OAuth
# tokens minted at runtime by the app service principal (see app/lib/db.py) and
# SQL/Genie use per-request user OBO tokens — there is NO Postgres password or
# API token to configure. DATABRICKS_HOST and the SP OAuth credentials
# (DATABRICKS_CLIENT_ID/SECRET) are provided by the Apps runtime, not here.

command:
  - "streamlit"
  - "run"
  - "streamlit_app.py"
  - "--server.port"
  - "$DATABRICKS_APP_PORT"
  - "--server.address"
  - "0.0.0.0"

env:
  # --- Streamlit-on-Apps proxy settings --------------------------------------
  # Required by the Databricks Streamlit-on-Apps guidance: the app runs behind
  # the Apps reverse proxy, so Streamlit's own CORS + XSRF protection must be
  # disabled or the WebSocket / proxy handshake fails.
  - name: "STREAMLIT_SERVER_ENABLE_CORS"
    value: "false"
  - name: "STREAMLIT_SERVER_ENABLE_XSRF_PROTECTION"
    value: "false"

  # --- Static, non-secret config (literal values sourced from app/.env) -------
  # Lakebase (Postgres / OLTP) connection targets — read by app/lib/db.py.
  - name: "PGHOST"
    value: "ep-lucky-moon-d1e6mir6.database.us-west-2.cloud.databricks.com"
  - name: "PGDATABASE"
    value: "capstone_db"
  - name: "PG_INSTANCE_NAME"
    value: "capstone-pg"
  # Lakebase UC catalog that fronts the Postgres instance (reverse-ETL / synced
  # tables). Non-secret; included for completeness of the Lakebase config.
  - name: "PG_UC_CATALOG"
    value: "suro_capstone_lb_sbx"

  # SQL warehouse used for OBO warehouse queries — read by app/lib/sql.py.
  - name: "WAREHOUSE_ID"
    value: "fe136bafc7c46e7a"

  # AI/BI dashboard embedded on the Dashboard page — read by app/lib/config.py.
  - name: "DASHBOARD_ID"
    value: "01f187538c8a1eeca2d0c39e709a0a57"

  # Genie space chatted against on the Genie page — read by app/lib/config.py.
  - name: "GENIE_SPACE_ID"
    value: "01f187538de014de98715e9a3f4853da"

  # Workspace parent path for deployed assets (bundle / reverse-ETL context).
  - name: "PARENT_PATH"
    value: "/Workspace/Users/surojit.chowdhury@databricks.com/capstone"

  # Delta gold source (UC) — catalog/schema read by app/lib/data.py.
  - name: "CAPSTONE_CATALOG"
    value: "suro_cat"
  - name: "CAPSTONE_SCHEMA"
    value: "app_capstone"

  # --- Bundle-injected values (valueFrom) ------------------------------------
  # FORWARD_ETL_JOB_ID is bound by the bundle (T8): resources/app.yml declares an
  # app resource named "forward-etl-job" pointing at the bundle-managed forward-
  # ETL job (resources/jobs.yml). At deploy time the Apps runtime resolves this
  # `valueFrom` to that job's id and injects it as FORWARD_ETL_JOB_ID, which the
  # SP forward-ETL trigger in app/lib/jobs.py reads. No hard-coded job id.
  - name: "FORWARD_ETL_JOB_ID"
    valueFrom: "forward-etl-job"   # <-- resource name declared in resources/app.yml

# ---------------------------------------------------------------------------
# OBO SCOPES ARE NOT CONFIGURED HERE.
#
# app.yaml (the runtime config) supports only `command` and `env`. On-behalf-of-
# user scopes are a property of the *app resource*, declared as `user_api_scopes`
# (list of strings, Public Preview) — verified via `databricks bundle schema`
# (github.com/databricks/cli/bundle/config/resources.App -> user_api_scopes).
#
# For this app they must be exactly:
#     user_api_scopes:
#       - sql               # SQL warehouse queries as the calling user (app/lib/sql.py)
#       - dashboards.genie  # Genie Conversation API as the calling user (app/lib/genie.py)
# matching OBO_SCOPES in app/lib/auth.py. See resources/app.yml for the declared
# app resource, and the PR body for where/how it is applied.
#
# The platform auto-adds iam.current-user:read and iam.access-control:read; do
# NOT list them (or `dashboards` / `postgres`) — the Apps API rejects extra
# scopes. Lakebase is intentionally absent: it does not support OBO and always
# runs as the app service principal (see app/lib/db.py).
#
# DEPLOY-TIME PREREQUISITES (validated at deploy time — see the PR body):
#   * The workspace OBO preview toggle must be ON
#     (Settings -> Apps -> "User authorization (preview)"). Without it these
#     scopes will not persist and X-Forwarded-Access-Token is never injected.
#   * On first load each user is prompted for one-time consent on these scopes;
#     OBO only carries through after they click Authorize.
