# Databricks Asset Bundle — app resource definition for the Customer 360 app.
#
# WHY THIS FILE (T6): OBO (on-behalf-of-user) scopes are NOT part of the
# app.yaml runtime schema (which supports only `command` and `env`). They are a
# property of the *app resource*, declared here as `user_api_scopes`.
#
# Verified against `databricks bundle schema`:
#   $defs .../bundle/config/resources.App -> properties.user_api_scopes
#   => {"description": "[Public Preview]", "$ref": ".../slice/string"}  (list of strings)
# i.e. `user_api_scopes` is a list-of-string field on the App resource. This is
# also what T8's spec calls for: "user_api_scopes: [sql, dashboards.genie]".
#
# SCOPE OF T6: this file contributes the `user_api_scopes` (the review's
# BLOCKING-1 fix). The rest of the git-source-app wiring — `git_repository`,
# `git_source` (branch + source_code_path: app/), the resource bindings
# (sql_warehouse / database / genie_space / forward-ETL job), and the
# `databricks.yml` `include:` + variables — is owned by T8. Until T8 adds the
# `include:` for resources/ in databricks.yml, this file is inert (no bundle
# command loads it), so it cannot break validation today.
#
# The two scopes below MUST stay exactly in sync with OBO_SCOPES in
# app/lib/auth.py: ("sql", "dashboards.genie"). Do NOT add iam.current-user:read
# / iam.access-control:read (platform auto-adds them) or `dashboards` / `postgres`
# (rejected by the Apps API).

resources:
  apps:
    customer360:
      name: "customer360"
      description: "Customer 360 — Streamlit app on Databricks Apps (Lakebase capstone)."

      # OBO scopes requested by the app (Public Preview). This is the correct
      # home for OBO scopes — NOT app/app.yaml.
      user_api_scopes:
        - "sql"               # SQL warehouse queries as the calling user (app/lib/sql.py)
        - "dashboards.genie"  # Genie Conversation API as the calling user (app/lib/genie.py)

      # --- T8 completes the git-source-app wiring below --------------------------
